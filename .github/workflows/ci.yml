name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter @changebot/core exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm run build

      - name: Run built-output smoke test
        run: pnpm run test.smoke
